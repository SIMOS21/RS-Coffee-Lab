# Local disposable stack only; no linked project or production credentials.
project_id = "rs-coffee-lab-test"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Only db:test applies the guarded demonstration seed explicitly.
enabled = false
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = false
